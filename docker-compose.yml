version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # ── Google Gemini / Gemma 4 (PRIMARY — REQUIRED) ──────────────────
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMMA_CLOUD_MODEL=${GEMMA_CLOUD_MODEL:-gemma-4-31b-it}

      # ── HuggingFace BLIP Vision (optional) ────────────────────────────
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}

      # ── Groq Llama 3.2 Vision (optional) ──────────────────────────────
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      # ── Mistral Pixtral Vision (optional) ─────────────────────────────
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}

      # ── Ollama (local model — host machine must have Ollama running) ───
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GEMMA_LOCAL_MODEL=${GEMMA_LOCAL_MODEL:-gemma2:9b}

      # ── Database ───────────────────────────────────────────────────────
      - DATABASE_URL=/data/raksha.db

      # ── App ────────────────────────────────────────────────────────────
      - APP_NAME=${APP_NAME:-RAKSHA AI}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-false}
      - PORT=8000

      # ── CORS (update for production domain) ───────────────────────────
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8000","http://localhost:3000"]}

      # ── Performance ────────────────────────────────────────────────────
      - GEMMA_CLOUD_TIMEOUT=${GEMMA_CLOUD_TIMEOUT:-60}
      - GEMMA_CLOUD_RETRIES=${GEMMA_CLOUD_RETRIES:-3}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - POLLINATIONS_TIMEOUT=${POLLINATIONS_TIMEOUT:-20}
      - MODEL_CHECK_INTERVAL=${MODEL_CHECK_INTERVAL:-30}

    volumes:
      - raksha_data:/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

volumes:
  raksha_data:
    driver: local
